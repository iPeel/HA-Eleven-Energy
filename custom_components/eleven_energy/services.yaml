# Structure only. Names, descriptions and field labels live in translations/en.json, which is
# where Home Assistant has read them from since 2024.8 - keeping them here as well would be two
# copies to drift apart.
#
# These actions change what an inverter is doing, so what they want is a device. A device filter
# is not allowed inside target - Home Assistant rejects it and directs you to a device selector -
# so the inverter is a field of its own, which is where resolve_device already looks for it.
#
# The entity target stays. It resolves to the device the entity belongs to, so automations written
# against the older definition keep working, and with neither given the code falls back to the
# first inverter on the site - which is the wrong machine where a site has two, hence the field.

set_work_mode_self_consumption:
  target:
    entity:
      integration: eleven_energy
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: eleven_energy
    percent_to_battery:
      required: false
      example: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

set_work_mode_force_charge:
  target:
    entity:
      integration: eleven_energy
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: eleven_energy
    target_power:
      required: true
      example: 3.5
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          unit_of_measurement: kW
          mode: box
    target_percent:
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

