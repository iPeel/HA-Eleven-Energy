# Structure only. Names, descriptions and field labels live in translations/en.json, which is
# where Home Assistant has read them from since 2024.8 - keeping them here as well would be two
# copies to drift apart.
#
# Targets are devices, not entities. These actions change what an inverter is doing, the code
# resolves a device to its cloud id, and an entity target left it with nothing to resolve - so it
# fell back to the first inverter it could find, which is the wrong machine on a site with two.
# An entity target is still accepted and resolved to the device it belongs to, so automations
# written against the old definition keep working.

set_work_mode_self_consumption:
  target:
    device:
      integration: eleven_energy
    entity:
      integration: eleven_energy
  fields:
    percent_to_battery:
      required: false
      example: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

set_work_mode_force_charge:
  target:
    device:
      integration: eleven_energy
    entity:
      integration: eleven_energy
  fields:
    target_power:
      required: true
      example: 3.5
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          unit_of_measurement: kW
          mode: box
    target_percent:
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

