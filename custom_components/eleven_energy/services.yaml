# Structure only. Names, descriptions and field labels live in translations/en.json, which is
# where Home Assistant has read them from since 2024.8 - keeping them here as well would be two
# copies to drift apart.
#
# These actions change what an inverter is doing, so what they want is a device. Home Assistant
# forbids a device key in target outright and directs you to a device selector, so the inverter
# is a field - which is where resolve_device already looks for it, ahead of any entity.
#
# No target is declared, because declaring one makes it required: every automation written without
# one - which is most of them, since the fallback has always picked the only inverter on the site -
# was shown as an error in the editor for a target it had never needed.
#
# device_id and entity_id are still accepted in the call, so automations written against any
# earlier definition keep resolving to the same machine.

set_work_mode_self_consumption:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: eleven_energy
    percent_to_battery:
      required: false
      example: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

set_work_mode_force_charge:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: eleven_energy
    target_power:
      required: true
      example: 3.5
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          unit_of_measurement: kW
          mode: box
    target_percent:
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

